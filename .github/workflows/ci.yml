name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .
      - name: Run tests
        run: pytest -m "not slow and not integration" --ignore=tests/e2e/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e .
          # Pin the formatters. `black>=21` otherwise floats to a newer
          # release and fails --check on code the previous release accepted.
          pip install 'black==26.5.1' 'isort==8.0.1' 'flake8==7.3.0'
      - name: Check formatting (black)
        run: black --check src/ tests/
      - name: Check imports (isort)
        run: isort --check src/ tests/
      - name: Lint (flake8)
        run: flake8 src/ tests/
