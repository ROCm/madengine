# madengine Codebase Wiki -> GitHub Pages (/wiki/)
#
# Publishes docs/wiki/index.html to <pages-url>/wiki/. The GitHub Wiki cannot
# render this page (it strips <style>, <script> and inline SVG), so the Wiki
# only links here.
#
# This repo has a single Pages site, shared with setup-page-external.yml, and
# every deploy replaces the whole site. Each workflow therefore carries the
# other's content forward: this one re-publishes the currently live setup page
# at the site root, and setup-page-external.yml re-publishes the wiki.
#
# One-time setup:
#   - Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Codebase Wiki (GitHub Pages)

on:
  push:
    branches: [develop]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

# Required for actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Shared with setup-page-external.yml so the two never deploy at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout madengine
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/wiki
          cp docs/wiki/index.html _site/wiki/index.html
          # Keep the setup page currently published at the site root, if any.
          if curl -fsSL "${{ steps.pages.outputs.base_url }}/index.html" -o _site/index.html; then
            echo "Preserved existing setup page at site root."
          else
            rm -f _site/index.html
            echo "No setup page published yet; site root left empty."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}wiki/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
