multinode: false
accelerator:
  type: amd
modelArtifacts:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  size: 10Gi
  authSecretName: llm-d-hf-token
  mountPath: /model-cache
routing:
  servicePort: 8000
  proxy:
    enabled: true
    connector: nixlv2
    image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.11.0
    imagePullPolicy: IfNotPresent
prefill:
  create: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "100%"
      maxSurge: 0
  parallelism:
    tensor: 1
    data: 1
    dataLocal: 1
  imagePullSecrets:
    - name: dockerhub-rocm
  nodeSelector:
    feature.node.kubernetes.io/amd-gpu: "true"
  extraConfig:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                llm-d.ai/inference-serving: "true"
            topologyKey: kubernetes.io/hostname
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
  containers:
    - name: vllm
      image: rocm/mad-private:ci-vllm_pyt_vllm_qwen3-8b_pyt_vllm.ubuntu.amd
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      args:
        - --max-model-len
        - "8192"
        - --gpu-memory-utilization
        - "0.85"
        - --enforce-eager
        - --kv-transfer-config
        - '{"kv_connector":"NixlConnector","kv_role":"kv_both","kv_buffer_device":"cuda"}'
      env:
        - name: GPU_MAX_HW_QUEUES
          value: "2"
        - name: HSA_ENABLE_SDMA
          value: "0"
        - name: HIP_VISIBLE_DEVICES
          value: "0"
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "0"
        - name: UCX_TLS
          value: "rocm_copy,rocm_ipc,tcp,self,sm"
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: "5557"
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
        limits:
          cpu: "16"
          memory: 64Gi
      mountModelVolume: true
      volumeMounts:
        - name: metrics-volume
          mountPath: /.config
        - name: shm
          mountPath: /dev/shm
